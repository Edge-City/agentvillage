[pytest]
# `plugins/av-events/` is a real Python package (Hermes requires `__init__.py`)
# whose modules use relative imports. pytest 8's `Package.setup()` imports that
# `__init__.py` unconditionally, and the relative imports only resolve when the
# module name is derived from the repo root — hence rootdir here and importlib
# import mode rather than a config file inside the plugin.
# `plugins/dashboard-auth-edgecity/__init__.py` imports Hermes; it tolerates a missing
# `hermes_cli` so this collection works without Hermes (its Hermes-backed tests skip).
addopts = --import-mode=importlib
testpaths = plugins/av-events/tests plugins/recall/tests plugins/dashboard-auth-edgecity/tests plugins/av-approval/tests plugins/index-links/tests plugins/av-display/tests
python_files = test_*.py
