[pytest]
# `plugins/av-events/` is a real Python package (Hermes requires `__init__.py`)
# whose modules use relative imports. pytest 8's `Package.setup()` imports that
# `__init__.py` unconditionally, and the relative imports only resolve when the
# module name is derived from the repo root — hence rootdir here and importlib
# import mode rather than a config file inside the plugin.
addopts = --import-mode=importlib
testpaths = plugins/av-events/tests
python_files = test_*.py
