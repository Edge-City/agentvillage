# Tests on every pull request and every push to main: the TypeScript suites
# (installer, scripts, the two skills with tests) and the plugin pytest suites
# (pytest.ini: plugins/av-events/tests, plugins/recall/tests,
# plugins/dashboard-auth-edgecity/tests, plugins/av-approval/tests; the Hermes-backed tests skip here). The same thing
# `bun test` and `python3 -m pytest` run locally; nothing here deploys.
name: test

on:
  pull_request:
  push:
    branches: [main]
  # tag-release.yml runs these suites at the commit it is about to tag.
  workflow_call:
    inputs:
      ref:
        description: Commit to test (empty for the triggering event's own commit)
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bun:
    name: bun test (install, scripts, skills)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Check out pinned Index plugin for morning tests
        uses: actions/checkout@v4
        with:
          repository: indexnetwork/hermes-plugin
          ref: eaec4fc02ffc251fca2cfd56b728c845562f6a3b
          path: .test-deps/index-hermes-plugin
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The directories that hold *.test.ts; a bare `bun test` would also
      # walk any stray checkout under the repo root.
      - run: bun test install/tests scripts/tests skills/index-network/scripts/tests skills/recall/scripts/tests skills/edge-india/scripts/tests skills/agent-profile/scripts/tests
        env:
          AV_INDEX_PLUGIN_TEST_DIR: ${{ github.workspace }}/.test-deps/index-hermes-plugin

  pytest:
    name: pytest (plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pytest pyyaml
      - run: python -m pytest -q
