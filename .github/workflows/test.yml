# Tests on pull requests (opened, new commits, reopened, marked ready) and on
# every push to main: the TypeScript suites (installer, scripts, the skills with
# tests) and the plugin pytest suites (pytest.ini's testpaths; the Hermes-backed
# tests skip here). The same thing `bun test` and `python3 -m pytest` run
# locally; nothing here deploys.
# WARNING: Tag release (tag-release.yml) trusts a green push-to-main run of this
# workflow as proof the suites ran at that commit, so no job here may be skipped on push.
# On a push to main, and when Tag release calls this file, both suites always run
# in full. Only on a pull request may a job end early, with "nothing to test",
# when every file the pull request changes is one that suite never reads (the
# "scope" step in each job lists them; anything else, or a diff it cannot read,
# runs the suite). Each job still runs and passes, so its check stays green.
name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # tag-release.yml runs these suites at the commit it is about to tag.
  workflow_call:
    inputs:
      ref:
        description: Commit to test (empty for the triggering event's own commit)
        type: string
        required: false
        default: ""

permissions:
  contents: read

# A newer run on the same pull request, or on main, cancels the older one (a
# cancelled main run only means Tag release runs the suites itself at that
# commit). When Tag release calls this file, each call has a group of its own, so
# a merge to main never cancels it.
concurrency:
  group: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && format('test-{0}', github.ref) || format('test-call-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bun:
    name: bun test (install, scripts, skills)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Depth 2: on a pull request the checkout is GitHub's merge commit, and its
      # first parent is the base branch, so HEAD^1..HEAD is what the PR changes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
      # Paths the bun suites never read (checked 2026-10-11; 2026-10-14): docs/,
      # the root README.md and LICENSE, pytest.ini, the root tests/ (Python
      # vectors), the notes in .github/ (*.md, instructions/). They do read
      # plugins/, workspace/, .github/workflows/, every .md under skills/ and
      # release/RC-MANIFEST.md (tag-release.test.ts parses it), so those run it.
      - name: Scope (pull requests only)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
              run=false
              while IFS= read -r f; do
                case "$f" in
                  '') ;;
                  docs/*|README.md|LICENSE|pytest.ini|tests/*|.github/*.md|.github/instructions/*) ;;
                  *) run=true; echo "runs the suite: $f"; break ;;
                esac
              done <<<"$files"
            else
              echo "::warning::could not list the pull request's changed files; running the suite"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then echo "nothing to test: this pull request changes only files the bun suites never read"; fi
      # Full history: the plugin-bump tests in moralmod_arm_pin.test.ts move a box's checkout to
      # another real revision (ov#288 refute M1); they skip if that revision is not here.
      - name: Check out pinned Index plugin for morning tests
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: indexnetwork/hermes-plugin
          ref: 04d833b840541fedabe78cbdad306c18853d784a
          path: .test-deps/index-hermes-plugin
          fetch-depth: 0
          persist-credentials: false
      # The ZZZ installer test executes its actual embedded Python JOB_API against
      # Hermes cron.jobs; a TS fake cannot catch a broken safe/rotate predicate.
      - name: Check out pinned Hermes for ZZZ job API test
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: f97608f178d1ffeca59860195ab7da295f7c8e5f
          path: .test-deps/hermes-agent
          persist-credentials: false
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.scope.outputs.run == 'true'
        run: python -m pip install --quiet PyYAML==6.0.2 croniter==6.0.0
      # The reviewed MoralMod release the overlay pins, for the connected installer test in
      # moralmod_host.test.ts: the public release assets of this repo, so no token. The digest and
      # the tag come from install/moralmod_release.ts; release.json must hash to the pin (the
      # installer then checks every other file against release.json). No pin, no fetch: it skips.
      - name: Fetch the pinned MoralMod release
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          pin=$(sed -n 's/^export const MORALMOD_RELEASE_SHA256 = "\([0-9a-f]\{64\}\)";$/\1/p' install/moralmod_release.ts)
          if [ -z "$pin" ]; then echo "no release pinned: the connected installer test skips"; exit 0; fi
          page=$(grep -o "https://github\.com/[A-Za-z0-9_.-]*/[A-Za-z0-9_.-]*/releases/tag/moralmod-[0-9a-f]*-${pin:0:12}" install/moralmod_release.ts | head -n 1 || true)
          if [ -z "$page" ]; then echo "::error::install/moralmod_release.ts names no release page for the pin ${pin:0:12}"; exit 1; fi
          dir=.test-deps/moralmod-release
          mkdir -p "$dir"
          for f in release.json negotiator-core.js negotiator-runtime.js INDEX-LICENSE; do
            curl --fail --silent --show-error --location --retry 3 -o "$dir/$f" "${page/\/tag\//\/download\/}/$f"
          done
          echo "$pin  $dir/release.json" | sha256sum -c -
      - if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile
      # The directories that hold *.test.ts; a bare `bun test` would also
      # walk any stray checkout under the repo root.
      - if: steps.scope.outputs.run == 'true'
        run: bun test install/tests scripts/tests skills/index-network/scripts/tests skills/recall/scripts/tests skills/edge-india/scripts/tests skills/agent-profile/scripts/tests skills/edgeos/scripts/tests
        env:
          AV_INDEX_PLUGIN_TEST_DIR: ${{ github.workspace }}/.test-deps/index-hermes-plugin
          AV_MORALMOD_RELEASE_TEST_DIR: ${{ github.workspace }}/.test-deps/moralmod-release
          AV_HERMES_JOBAPI_TEST_DIR: ${{ github.workspace }}/.test-deps/hermes-agent

  pytest:
    name: pytest (plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
      # Paths the pytest suites never read (checked 2026-10-11; 2026-10-14): docs/,
      # LICENSE, .gitignore, scripts/tests/, install/tests/, *.test.ts files,
      # package.json, bun.lock, release/ (the RC manifest), and workflows other
      # than this one. They do read install/*.ts, the root scripts/*.ts (the
      # custody scan in av-approval's test_custody.py), skills/ (SKILL.md,
      # prompts, fixtures, recall.ts), workspace/, the root README.md and
      # tests/vectors, so those run it.
      - name: Scope (pull requests only)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
              run=false
              while IFS= read -r f; do
                case "$f" in
                  '') ;;
                  .github/workflows/test.yml) run=true; echo "runs the suite: $f"; break ;;
                  docs/*|LICENSE|.gitignore|scripts/tests/*|install/tests/*|*.test.ts|package.json|bun.lock|release/*|.github/*) ;;
                  *) run=true; echo "runs the suite: $f"; break ;;
                esac
              done <<<"$files"
            else
              echo "::warning::could not list the pull request's changed files; running the suite"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then echo "nothing to test: this pull request changes only files the pytest suites never read"; fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.scope.outputs.run == 'true'
        # python-telegram-bot at Hermes v2026.9.24's pin: av-vote's real-PTB dispatch tests (OV-358).
        run: python -m pip install --quiet pytest pyyaml python-telegram-bot==22.8
      # MM-INFER-VIS (ov#404 refute S2): av-events' negotiator seam is pinned to the real speaker.py
      # at INDEX_PLUGIN_REF; the parity test reads it here (parsed, never imported) and skips without it.
      - name: Check out pinned Index plugin for the negotiator seam parity test
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: indexnetwork/hermes-plugin
          ref: 04d833b840541fedabe78cbdad306c18853d784a
          path: .test-deps/index-hermes-plugin
          persist-credentials: false
      - if: steps.scope.outputs.run == 'true'
        run: python -m pytest -q
        env:
          AV_INDEX_PLUGIN_TEST_DIR: ${{ github.workspace }}/.test-deps/index-hermes-plugin

  # CLASS-DIFF release gate (B-167; lead ruling CLAIMS L15681 (1); EDGEOS-BLOCK).
  #
  # Core 0.4.6 reached the boxes on 19 Oct and every EdgeOS recipe this overlay
  # ships moved from auto (network.call) to a human-only deny (policy.core):
  # nothing had run the fleet's own recipes through the new core. This job runs
  # them on every pull request, every push to main and every Tag release call
  # (so a tag is only cut from a commit where it passed): the overlay's whole
  # shipped corpus (every skills/ and workspace/ recipe, the inline cron
  # prompts, and the template's tools: lines for the box harness calls) at the
  # approval.md core the base pins and at the core this tree pins
  # (APPROVAL_MD_PINNED in scripts/tests/fetch-url-shape.test.ts, the control
  # plane's APPROVAL_MD_VERSION), each call in two working directories: a
  # neutral one and a box-like Hermes home (core's credential pass decides a
  # `$` word by where the command starts). A pull request that moves the pin shows every
  # call whose class, decision or card style moves, and fails when an existing
  # call moves from auto, sampled or card to human-only or refused, unless
  # scripts/approval-class-diff/allowlist.json names it with a reason. At an
  # unchanged pin it is approval.md's corpus check for this tree.
  #
  # Fold 1 (review-b's refute): every call runs through each core's REAL
  # `approval hook hermes` in a box layout (HOME/.hermes with a dummy .env, the
  # skills and workspace, APPROVAL_HERMES_HOME set): recipes as terminal calls
  # at $HERMES_HOME, $HOME, workspace and unset, harness calls as Hermes tool
  # envelopes. Any shipped recipe the hook denies there (human-only or refused)
  # fails unless allowlisted with Carter's acceptance, so a recipe EDITED into a
  # denied shape fails at an unchanged pin (ov#427 replayed); an existing call
  # that loses autonomy fails; a newly shadowed tools line fails.
  #
  # One source of truth: the extractor and the check are approval.md's own
  # scripts, checked out at the pinned commit below (approval-md/approval.md is
  # public, so no token). Move the ref to the v0.4.7 tag once that release
  # carries them; until then it names the head commit of the approval.md B-167 PR.
  #
  # The report (first line: the GATE line) is the job summary and the
  # `class-diff` artifact (markdown + JSON).
  class-diff:
    name: approval class-diff (shipped corpus at the pinned core)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Full history and tags: a push to main and a Tag release call measure
      # against the previous release tag (the overlay the boxes run), not HEAD^1
      # (B-167 fold 1 S-2), so a pin bump merged red stays red on every later
      # commit until a release carries it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: class-diff base (the PR's base, or the previous release tag)
        id: base
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base=$(git rev-parse HEAD^1)
            echo "pull request: measured against its base ${base:0:12}"
          elif tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-rc*' HEAD^ 2>/dev/null); then
            base=$(git rev-parse "$tag^{commit}")
            echo "$EVENT: measured against the previous release $tag (${base:0:12})"
          else
            echo "::error::no previous release tag (v*, not -rc) below HEAD; the class-diff has nothing the boxes run to measure against"
            exit 1
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: check out approval.md's extractor and check at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: approval-md/approval.md
          ref: fb998ecc3d01fc6e2aba623085f6b99703ae2120 # APPROVAL_MD_TOOL_REF, see the comment above
          path: .test-deps/approval-md-tool
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: class-diff, base pin -> this pin
        env:
          AV_APPROVAL_MD_TOOL_DIR: ${{ github.workspace }}/.test-deps/approval-md-tool
          AV_CLASS_DIFF_OUT: ${{ github.workspace }}/class-diff
          AV_CLASS_DIFF_BOX_CONCURRENCY: "4"
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          set +e
          bash scripts/approval-class-diff.sh "$BASE_REF"
          status=$?
          if [ -f class-diff/class-diff.md ]; then cat class-diff/class-diff.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status
      # The gate's own fixtures (flip fails, stay passes, new is reported) through the same script and tool.
      - name: class-diff fixtures
        if: always()
        env:
          AV_APPROVAL_MD_TOOL_DIR: ${{ github.workspace }}/.test-deps/approval-md-tool
        # A block, not a one-line `run: bun test`: Tag release reads test.yml's one such line as the suite
        # list (tag-release.ts suiteDirs), and this file already sits in that list's scripts/tests.
        run: |
          bun test scripts/tests/approval-class-diff.test.ts
      - name: upload the class-diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-diff
          path: class-diff/
          if-no-files-found: warn
