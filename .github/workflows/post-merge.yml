name: post-merge

# Manual only. The push trigger was removed on 2026-09-21: every push to
# main (including the reference-sync bot's several-a-day commits) called
# /hooks/sync, which re-syncs the overlay and restarts every live gateway.
# Rollout is now an explicit per-tenant update from the control plane; run
# this workflow by hand if a fleet-wide refresh is really wanted.
# Rollback: restore `push: branches: [main]` under `on:`.
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SYNC_HOST: ${{ secrets.SYNC_HOST }}
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Refresh cache index
        run: |
          curl -sf -o /dev/null -X POST "https://${SYNC_HOST}/hooks/sync" \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' 2>/dev/null
