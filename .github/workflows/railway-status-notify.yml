# Railway status watcher (CLAIMS L18050, moved here from agentvillage-data by
# L18092 because Actions minutes are free on a public repo). Every five
# minutes, reads status.railway.com's JSON feed and posts one Telegram message
# per new incident or status change to the operator group through the alerts
# bot. It runs on GitHub, not on Railway, so it still speaks when Railway is
# down. Runbook: .github/railway-status/README.md.
#
# Public-repo hardening:
# - Triggers are schedule and workflow_dispatch only: no pull_request,
#   pull_request_target or workflow_run, so no fork or PR can run it or reach
#   its secrets.
# - permissions: contents: read (the cache works on the runtime token).
# - Secrets reach only the notify step, through env; the script logs codes,
#   incident slugs and counts, never a secret, the feed body or Telegram's reply.
# - No ${{ }} of feed data or of the dispatch input appears in a run: line;
#   DRY_RUN is computed into env and the script reads the feed itself.
# - Only refs/heads/main sends and saves state; a run from any other ref is a
#   dry run (the cache is scoped per branch, so a branch would fork the state).
# - The job runs only in Edge-City/agentvillage, never in a fork.
# - railway-status-notify.test.ts parses this file and pins these invariants.
#
# State (incident id -> status, updated time: public data only) lives in the
# Actions cache: restored by prefix (the newest), saved under a key unique to
# the run (cache entries are immutable), and only when the script wrote it. No
# state is a first run: everything is recorded and only unresolved incidents
# are posted.
#
# Secrets (names only; the same as agentvillage-data's alerts notifier):
#   ALERTS_TELEGRAM_BOT_TOKEN, ALERTS_TELEGRAM_CHAT_ID, ALERTS_TELEGRAM_THREAD_ID (optional)
name: railway-status-notify

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the messages instead of sending them (no Telegram secret needed, state not saved; always a dry run off main)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: railway-status-notify
  cancel-in-progress: false

jobs:
  watch:
    # Forks inherit the schedule but not the secrets: never run there.
    if: github.repository == 'Edge-City/agentvillage'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/railway-status/railway-status-notify.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Restore state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .railway-status
          key: railway-status-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: railway-status-state-

      - name: Check status.railway.com
        id: notify
        env:
          ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERTS_TELEGRAM_BOT_TOKEN }}
          ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.ALERTS_TELEGRAM_CHAT_ID }}
          ALERTS_TELEGRAM_THREAD_ID: ${{ secrets.ALERTS_TELEGRAM_THREAD_ID }}
          DRY_RUN: ${{ (github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && '1' || '' }}
        run: |
          if [ "$DRY_RUN" = "1" ]; then
            bun .github/railway-status/railway-status-notify.ts --state .railway-status/state.json --dry-run
          else
            bun .github/railway-status/railway-status-notify.ts --state .railway-status/state.json
          fi

      # always(): a Telegram failure exits 1 after recording what it did send,
      # and that must be kept so the next run does not send it twice.
      - name: Save state
        if: always() && github.ref == 'refs/heads/main' && steps.notify.outputs.changed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .railway-status
          key: railway-status-state-${{ github.run_id }}-${{ github.run_attempt }}
