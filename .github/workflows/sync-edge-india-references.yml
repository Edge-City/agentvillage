# Copies the Edge City India reference tree generated by aromeoes/edge-agent-skill
# (its indexer reads only the public wiki, website and Substack) into
# skills/edge-india/references/, through scripts/sync-india-references.ts:
# the whole tree or nothing. A missing, partial or non-India upstream tree fails
# this run and leaves the committed snapshot as it was. Commits only when a file
# changed. Replaces sync-edge-esmeralda-references.yml, which copied three
# Esmeralda-era files and has failed since the upstream moved to India
# (2026-10-01); skills/edge-esmeralda/references/ is now a frozen snapshot.
#
# Residents do not read this commit directly: they get the snapshot at the next
# tag and roll (docs/deployment.md), or sooner when AV_INDIA_REFS_LIVE=1 lets
# skills/edge-india/scripts/refs.ts refresh from this repo's main
# (skills/edge-india/README.md).
name: Sync Edge City India References

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Ref to pull from aromeoes/edge-agent-skill
        required: false
        default: main
      allow_shrink:
        description: Accept a snapshot that drops more than half its documents
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-edge-india-references
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout AgentVillage
        uses: actions/checkout@v4

      - name: Checkout reference source
        uses: actions/checkout@v4
        with:
          repository: aromeoes/edge-agent-skill
          ref: ${{ github.event.inputs.source_ref || 'main' }}
          path: reference-source
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Sync the snapshot (refuses incomplete trees)
        id: sync
        run: |
          set -euo pipefail
          commit=$(git -C reference-source rev-parse HEAD)
          commit_date=$(git -C reference-source log -1 --format=%cI)
          shrink=""
          if [ "${{ github.event.inputs.allow_shrink }}" = "true" ]; then shrink="--allow-shrink"; fi
          result=$(bun scripts/sync-india-references.ts \
            --source reference-source \
            --target skills/edge-india/references \
            --source-repo aromeoes/edge-agent-skill \
            --source-commit "$commit" \
            --source-commit-date "$commit_date" $shrink)
          echo "$result"
          echo "summary=$(echo "$result" | bun -e 'const r = JSON.parse(await Bun.stdin.text()); console.log(`${r.documents} documents; +${r.added.length} ~${r.updated.length} -${r.removed.length}`)')" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Commit reference changes
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A skills/edge-india/references/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No reference changes to commit."
            exit 0
          fi
          git commit -m "Update Edge City India references [automated]" \
            -m "${{ steps.sync.outputs.summary }} from aromeoes/edge-agent-skill@${{ steps.sync.outputs.commit }}"
          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "push failed after 3 attempts"
          exit 1

      - name: Dispatch skills sync
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-skills.yml --ref main
