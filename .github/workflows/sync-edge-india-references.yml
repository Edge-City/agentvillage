# Copies the Edge City India reference tree generated by p2p-lanes/edge-agent-skill
# (its indexer reads only the public wiki, website and Substack) into
# skills/edge-india/references/, through scripts/sync-india-references.ts:
# the whole tree or nothing. A missing, partial or non-India upstream tree fails
# this run and leaves the committed snapshot as it was. Replaces
# sync-edge-esmeralda-references.yml, which copied three Esmeralda-era files and
# has failed since the upstream moved to India (2026-10-01);
# skills/edge-esmeralda/references/ is now a frozen snapshot.
#
# Forwards as ONE pull request, never a commit to main (SEC-5 fix a): a changed
# tree is committed on the fixed branch bot/india-refs (force-updated, one commit
# over main) and one PR to main is opened, or refreshed when it is open already.
# A person reads the diff and merges; nothing reaches main, the agents, the
# next release's installed snapshot or the public agentvillage-skills repo
# before that merge. The PR body carries this run's self-check as well.
#
# Identity (SEC-5 follow-up b): the push and every gh call use a token of the
# mirror GitHub App (INDIA_MIRROR_APP_ID and INDIA_MIRROR_APP_PRIVATE_KEY, secrets of
# the environment india-mirror, deployable from main only; contents + pull
# requests, this repo only), minted
# after the sync step so no write token exists while upstream data is parsed,
# and revoked when the job ends. GITHUB_TOKEN is read-only here and never
# pushes or opens anything. Because the PR comes from the App and not from
# GITHUB_TOKEN, the Test workflow runs on it and on every head the bot pushes,
# and no org setting for Actions-created PRs is needed. Without the two
# secrets the run fails closed before any checkout: there is no fallback to
# GITHUB_TOKEN and none to a direct commit. If GitHub refuses to open the PR,
# the run fails and nothing is committed to main. A tree identical to main
# closes a stale PR.
# The bot acts only on its own PR (this repo's bot/india-refs, opened by
# the App, app/<its slug>; never a fork's same-named branch) and keeps a branch head only
# when it is its own commit (author, message) with the tree built here over the
# same main; it reuses that head's synced_at only as a strict, in-range ISO-8601
# UTC timestamp. The PR names the
# head and the references tree, and its merge line pins that head
# (--match-head-commit), because the branch moves at upstream's pace.
#
# Agents read main after the merge: each agent's "Edge — knowledge sync" job
# (skills/edge-india/scripts/knowledge-sync.ts, every 30 minutes) fetches
# skills/edge-india/references/manifest.json from main, its default URL, and
# verifies every file against the SNAPSHOT.json this run writes. The skill's
# refs.ts reads that local copy (or the snapshot installed at the agent's last
# roll) and never fetches in a turn by default (skills/edge-india/README.md).
# The sync refuses any tree that job would refuse, so a forwarded snapshot is
# always one every agent can take. The merge (a push to main under skills/)
# starts sync-skills.yml by itself, so this workflow dispatches nothing.
name: Sync Edge City India References

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Ref to pull from p2p-lanes/edge-agent-skill
        required: false
        default: main
      allow_shrink:
        description: Accept a snapshot that drops more than half its documents
        type: boolean
        required: false
        default: false

# GITHUB_TOKEN reads only; the mirror App's token carries the writes (bot branch, its PR).
permissions:
  contents: read

concurrency:
  group: sync-edge-india-references
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # The App's two secrets are ENVIRONMENT secrets of india-mirror, whose deployment branches are main only: a run from
    # any other branch (a dispatch, or a pull_request run of a PR's own copy of this file) never receives the key.
    environment: india-mirror
    timeout-minutes: 10
    steps:
      # Fail closed before any checkout or fetch: no App secrets, no run (never a GITHUB_TOKEN fallback).
      # Only whether each secret is set reaches the shell, never its value.
      - name: Require the mirror App's secrets
        env:
          HAS_APP_ID: ${{ secrets.INDIA_MIRROR_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.INDIA_MIRROR_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_APP_ID" != "true" ] || [ "$HAS_APP_KEY" != "true" ]; then
            echo "::error::refused: the india-mirror environment secrets INDIA_MIRROR_APP_ID and INDIA_MIRROR_APP_PRIVATE_KEY (the mirror GitHub App) must both be set. Nothing fetched, nothing pushed; there is no fallback to GITHUB_TOKEN."
            exit 1
          fi

      - name: Checkout AgentVillage
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout reference source
        uses: actions/checkout@v4
        with:
          repository: p2p-lanes/edge-agent-skill
          ref: ${{ github.event.inputs.source_ref || 'main' }}
          path: reference-source
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Sync the snapshot (refuses incomplete trees)
        id: sync
        run: |
          set -euo pipefail
          commit=$(git -C reference-source rev-parse HEAD)
          # Every publish names the upstream commit it came from: no readable commit, no publish.
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "refused: the upstream commit could not be read; nothing published" >&2
            exit 1
          fi
          commit_date=$(git -C reference-source log -1 --format=%cI)
          shrink=""
          if [ "${{ github.event.inputs.allow_shrink }}" = "true" ]; then shrink="--allow-shrink"; fi
          result=$(bun scripts/sync-india-references.ts \
            --source reference-source \
            --target skills/edge-india/references \
            --source-repo p2p-lanes/edge-agent-skill \
            --source-commit "$commit" \
            --source-commit-date "$commit_date" $shrink)
          echo "$result"
          echo "summary=$(echo "$result" | bun -e 'const r = JSON.parse(await Bun.stdin.text()); console.log(`${r.documents} documents; +${r.added.length} ~${r.updated.length} -${r.removed.length}`)')" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "commit_date=$commit_date" >> "$GITHUB_OUTPUT"

      # Minted only after the sync, so no write token exists while upstream data is parsed. Contents and pull
      # requests on this repo only (no workflows scope); the action masks it in the log and revokes it when the job ends.
      - name: Mint the mirror App's token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.INDIA_MIRROR_APP_ID }}
          private-key: ${{ secrets.INDIA_MIRROR_APP_PRIVATE_KEY }}
          owner: Edge-City
          repositories: agentvillage
          permission-contents: write
          permission-pull-requests: write

      - name: Forward the change as one pull request (never a commit to main)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_REPO: ${{ github.repository }}
          BRANCH: bot/india-refs
          SUMMARY: ${{ steps.sync.outputs.summary }}
          UPSTREAM: ${{ steps.sync.outputs.commit }}
          UPSTREAM_DATE: ${{ steps.sync.outputs.commit_date }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || 'main' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The PR's base is main, so only a run on main may forward: a run on any other branch checks and stops.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Checks passed on $GITHUB_REF; only a run on main forwards. Nothing pushed."
            exit 0
          fi
          # The App's identity comes from the token this job minted: its slug (GitHub reports its PRs as app/<slug>).
          if ! [[ $APP_SLUG =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::refused: the mirror App's token step gave no usable app slug. Nothing pushed."
            exit 1
          fi
          bot="${APP_SLUG}[bot] <${APP_SLUG}[bot]@users.noreply.github.com>"
          # The bot's own PR only: this repo's branch (never a fork's same-named branch), opened by the mirror App.
          open=$(gh pr list --head "$BRANCH" --base main --state open --json number,isCrossRepository,author,headRefName \
            | jq -r --arg login "app/$APP_SLUG" '[.[] | select(.isCrossRepository == false and .author.is_bot == true and .author.login == $login and .headRefName == "bot/india-refs") | .number | tostring] | join(" ")')
          case "$open" in *" "*)
            echo "::error::refused: more than one open bot PR from $BRANCH ($open); close the extras by hand. Nothing pushed."
            exit 1 ;;
          esac
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          # The App token reaches git only through this helper, which reads GH_TOKEN from the environment at each call:
          # never in a URL, an argument or .git/config (the checkout persists no credentials). It is the only helper:
          # the empty value resets any inherited one, and none that stores or caches (store, cache, a keychain) is added.
          git config --local credential.helper ''
          git config --local --add credential.helper '!f() { test "$1" = get || return 0; echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          base=$(git rev-parse HEAD)
          git switch -c "$BRANCH"
          snap=skills/edge-india/references/SNAPSHOT.json
          if [ -z "$(git status --porcelain -- skills/edge-india/references/)" ]; then
            echo "No reference changes against main."
            if [ -n "$open" ]; then
              gh pr close "$open"
              echo "Closed PR #$open: main already holds this upstream tree."
            fi
            exit 0
          fi
          # SNAPSHOT.json's synced_at is new on every run. If the branch head is the bot's own commit over this main,
          # take its timestamp so the tree comparison below can match, but only a strict ISO-8601 UTC string (whole
          # string, no newline) that parses and lies between the upstream commit and now; else this run's own stands.
          own=no
          if git fetch --quiet --depth=1 origin "refs/heads/$BRANCH" 2>/dev/null \
            && [ "$(git cat-file -p FETCH_HEAD | sed -n 's/^parent //p')" = "$base" ] \
            && [ "$(git log -1 --format='%an <%ae>' FETCH_HEAD)" = "$bot" ]; then
            own=yes
            theirs=$(git show "FETCH_HEAD:$snap" 2>/dev/null | jq -r '.synced_at // empty' 2>/dev/null || true)
            ours=$(jq -r '.synced_at' "$snap")
            iso='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?Z$'
            if [[ $theirs =~ $iso ]] && t=$(date -u -d "$theirs" +%s 2>/dev/null) \
              && [ "$t" -ge "$(date -u -d "$UPSTREAM_DATE" +%s)" ] && [ "$t" -le "$(date -u +%s)" ]; then
              sed "s/\"synced_at\": \"$ours\"/\"synced_at\": \"$theirs\"/" "$snap" > "$RUNNER_TEMP/snapshot-candidate.json"
              if git show "FETCH_HEAD:$snap" | cmp -s - "$RUNNER_TEMP/snapshot-candidate.json"; then
                cp "$RUNNER_TEMP/snapshot-candidate.json" "$snap"
              fi
            fi
          fi
          git add -A skills/edge-india/references/
          refs_tree=$(git write-tree --prefix=skills/edge-india/references/)
          git commit -m "Update Edge City India references [automated]" \
            -m "$SUMMARY from p2p-lanes/edge-agent-skill@$UPSTREAM" \
            -m "References tree: $refs_tree"
          # Keep the branch head only when it is the bot's own commit (author, parent main, message) with this exact
          # tree; otherwise push the commit built here.
          if [ "$own" = yes ] \
            && [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')" ] \
            && [ "$(git cat-file -p FETCH_HEAD | sed -n 's/^parent //p')" = "$base" ] \
            && [ "$(git log -1 --format=%B FETCH_HEAD)" = "$(git log -1 --format=%B HEAD)" ]; then
            head=$(git rev-parse FETCH_HEAD)
            echo "$BRANCH already holds this tree over main $base at $head; not re-pushed."
          else
            git push --force origin "HEAD:refs/heads/$BRANCH"
            head=$(git rev-parse HEAD)
          fi
          files=$(git diff --name-status "$base" "$head")
          body="$RUNNER_TEMP/india-refs-pr.md"
          write_body() {
            {
              echo "Automated forward of the Edge City India references. Nothing reaches main, the agents, the next release or agentvillage-skills until a person merges this PR."
              echo
              echo "- Head: $head"
              echo "- References tree: $refs_tree (\`skills/edge-india/references\` at that head)"
              echo "- Upstream: p2p-lanes/edge-agent-skill@$UPSTREAM (ref \`$SOURCE_REF\`, committed $UPSTREAM_DATE)"
              echo "- Base: main $base"
              echo "- Sync self-check (this workflow's own report, not CI): passed, $SUMMARY (scripts/sync-india-references.ts: complete India-only tree, size caps, names, UTF-8 with no NUL or HTML, manifest links on the guide's hosts, shrink guard; SNAPSHOT.json records each file's sha256 and the upstream commit)"
              echo "- Run: $RUN_URL"
              echo
              echo "Review the text, not just the checks: the checks prove shape, not content. A changed price, contact, date or instruction reaches every resident as fact within about 35 minutes of the merge."
              echo
              echo "The bot force-updates $BRANCH at upstream's pace, so the head can change under this PR. Merge only the head you reviewed, after a green Test run at that head, and name it:"
              echo
              echo "    gh pr merge $1 -R $GH_REPO --squash --match-head-commit $head"
              echo
              echo "The mirror App opens and updates this PR, so the Test workflow runs on it and again on every head the bot pushes. The merge starts sync-skills.yml and test.yml on main."
              echo
              echo "Files changed at $head against main ($(printf '%s\n' "$files" | wc -l | tr -d ' ')):"
              echo
              echo '```'
              printf '%s\n' "$files" | head -n 200
              echo '```'
            } > "$body"
          }
          title="Edge City India references from p2p-lanes/edge-agent-skill@${UPSTREAM:0:8}, head ${head:0:8} [automated]"
          if [ -n "$open" ]; then
            write_body "$open"
            gh pr edit "$open" --title "$title" --body-file "$body"
            echo "Refreshed PR #$open at $head."
          else
            write_body "<this PR's number>"
            if ! url=$(gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body"); then
              echo "::error::refused: GitHub would not open the pull request (is the mirror App installed on this repo with Pull requests: write?). Nothing was committed to main; the forward waits on $BRANCH. Never commit to main instead."
              exit 1
            fi
            # Name the new PR in its own merge line.
            write_body "${url##*/}"
            gh pr edit "${url##*/}" --body-file "$body"
            echo "Opened $url at $head."
          fi
