# Splits skills/ and pushes to Edge-City/agentvillage-skills (matching branch).
#
# The skills/ directory IS the repo root in the target repos, so plugin
# manifests (.claude-plugin/, .codex-plugin/, openclaw.plugin.json) land
# where installers expect them.
name: Sync Agentvillage-skills

on:
  push:
    branches: [dev, main]
    paths:
      - 'skills/**'
  workflow_dispatch:

concurrency:
  group: sync-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Auth is a write deploy key on Edge-City/agentvillage-skills (not a
      # personal token): the key is tied to the mirror repo, not to a person,
      # and it can push to nothing else. Rotate by generating a new keypair,
      # replacing the deploy key on the mirror and the secret here.
      - name: Load the mirror deploy key
        env:
          DEPLOY_KEY: ${{ secrets.SKILLS_SYNC_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "❌ SKILLS_SYNC_DEPLOY_KEY secret is not set."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/skills_sync
          chmod 600 ~/.ssh/skills_sync
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/skills_sync -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Split and push
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          echo "Splitting skills/ on $BRANCH..."
          SPLIT_SHA=$(git subtree split --prefix=skills "$BRANCH")
          echo "Split SHA: $SPLIT_SHA"

          git push --force \
            "git@github.com:Edge-City/agentvillage-skills.git" \
            "${SPLIT_SHA}:refs/heads/${BRANCH}"
          echo "✓ pushed to Edge-City/agentvillage-skills ($BRANCH)"
