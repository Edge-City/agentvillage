# Mini-apps PR review, bot v0: the deterministic half of the PR-review bot
# (MINIAPPS-PLATFORM-v2-design.md §6.1, §6.3, §8 Phase 0 item 3). It runs
# scripts/mini-apps-review.ts over the pull request's diff and writes the §6.3
# JSON to the job summary and to an artifact named mini-apps-review.
#
# Trust (release S1, CLAIMS L14538): the pull request is DATA, never code. The
# tool (scripts/mini-apps-review.ts, P0-1's validator, P0-5's suite) is the BASE
# commit's tree, checked out alone into tool/. The pull request head is fetched
# as git objects only and read with git diff / ls-tree / cat-file on its sha:
# never checked out, never installed, never executed, its bunfig.toml, .env and
# tsconfig.json never read. bun runs the tool by explicit path
# (./tool/scripts/..., which no package.json script name can shadow) with
# --config=/dev/null --no-env-file --no-install --tsconfig-override=/dev/null,
# from a workspace that holds only tool/ (review-b N-a: the flags, not an empty
# cwd, are the guard). The bot judges exactly the head sha it fetched (--head
# "$HEAD_SHA"), never the merge ref. The base branch's tip is fetched as data
# too (--base-tip), so what main gained after the fork still counts (N-d).
#
# Conformance (release's owner read of P0-5, CLAIMS L14465): the bot runs the
# TOOL's copy of P0-5's suite, when present, on head's manifest and skill bytes
# taken from git objects, with --base. A committed conformance.json is never
# trusted. The suite's output goes into the artifact too. The version-bump rule
# is reported (N) and not enforced until S2 is settled.
#
# Phase 0: advisory. It is not a required check and it never uses
# pull_request_target. The review job holds no secret and no write token. Exit
# 0 for PASS and NEEDS_HUMAN, exit 1 for FAIL (the job is red; the check is
# still not required), exit 2 when the bot cannot judge (the report then says
# FAIL with bot_error).
#
# The comment job (P0-3 operating rule; design §6.3): a separate job on a fresh
# runner that only ever sees the review job's artifact, never the pull request.
# It posts the §6.3 JSON as ONE pull request comment, edited in place on each
# push and marked DRY RUN (scripts/mini-apps-review-comment.ts, run from the
# BASE tree like the review). It never approves, merges, requests changes or
# posts a check run. Its token is a GitHub App installation token, minted last
# and revoked at the end of the job by actions/create-github-app-token, from
# two repository secrets read by name: MINI_APPS_BOT_CLIENT_ID and
# MINI_APPS_BOT_PRIVATE_KEY (a human creates the App and the secrets, C4).
# The token asks for Pull requests write only. When neither secret is set (a
# fork's pull request, or before the App exists) the job says so in its
# summary and skips the rest, green. When only one is set, or anything after
# that fails (no report, a malformed report, an API error), it fails red and
# posts nothing that reads as a pass (a missing or malformed report sets the
# comment to FAIL bot_error for this head).
#
# NON-REQUIRED, by design (review-b N-b, a design item for the lead and release):
# - on pull_request GitHub runs the pull request's own copy of THIS FILE, so a
#   pull request that edits it can change what runs (a gate file: the honest
#   bot classes it core);
# - a pull request can ADD a workflow of its own with this workflow name, job
#   name and artifact name, and NEEDS_HUMAN exits 0 (green), so a check that is
#   required by name is satisfied by a forgery or by a NEEDS_HUMAN alike.
# Real gating needs a ruleset-required workflow pinned to the base (not
# pull_request_target alone), with the verdict read from that run's JSON
# artifact by run id, never from a check's name or colour (design §6.4). Until
# then this check stays non-required.
name: mini-apps review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "mini-apps/**"
      - "skills/**"

permissions:
  contents: read

concurrency:
  group: mini-apps-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: mini-apps review (bot v0, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The tool: the BASE commit's tree, full history (the bot diffs base...head
      # from their merge base and refuses a shallow or partial clone).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tool
          fetch-depth: 0
          persist-credentials: false
      # no-cache: never restore bun from the Actions cache. The script needs no
      # packages (node: built-ins only), so there is no bun install.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      # The pull request head: objects only, into a ref of the tool's repository.
      # Nothing is checked out. The event's values go through env, never into the
      # shell text.
      # The base branch's current tip too, as data (review-b N-d).
      - name: Fetch the pull request head (data only)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git -C tool fetch --no-tags --no-recurse-submodules --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          git -C tool cat-file -e "${HEAD_SHA}^{commit}"
          git -C tool fetch --no-tags --no-recurse-submodules --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/base/tip"
      - name: Review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          bun --config=/dev/null --no-env-file --no-install --tsconfig-override=/dev/null ./tool/scripts/mini-apps-review.ts --repo tool \
            --base "$BASE_SHA" --head "$HEAD_SHA" --base-tip refs/remotes/base/tip --author "$PR_AUTHOR" \
            --out "$RUNNER_TEMP/mini-apps-review.json" --summary "$RUNNER_TEMP/mini-apps-review.md" \
            --conformance-dir "$RUNNER_TEMP/mini-apps-conformance"
      - name: Job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mini-apps-review.md" ]; then cat "$RUNNER_TEMP/mini-apps-review.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$RUNNER_TEMP/mini-apps-review.json" ]; then
            { echo; echo '```json'; cat "$RUNNER_TEMP/mini-apps-review.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**FAIL** (bot_error): the bot could not run and wrote no report; the Review step failed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mini-apps-review
          path: |
            ${{ runner.temp }}/mini-apps-review.json
            ${{ runner.temp }}/mini-apps-conformance/
          if-no-files-found: warn
          retention-days: 14

  # The PR comment (dry run). needs: review, so it runs after the review job,
  # and !cancelled(), so a FAIL (exit 1) or a bot error (exit 2) is posted too.
  comment:
    name: mini-apps review comment (bot v0, dry run)
    needs: review
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The App's two secrets live ONLY in this GitHub Environment, restricted to
    # the main branch with no required reviewers (lead ruling 20 Oct). A run on
    # any other ref, a same-repo PR branch included, gets no secrets, so the
    # gate below skips green; the comment posts once a workflow_run follow-up
    # runs this job from main.
    environment: mini-apps-bot
    permissions:
      contents: read
    steps:
      # Whether the App's secrets exist, as true/false only: no secret value
      # enters this step. Neither set: skip, green. One set: fail closed.
      - name: Comment gate
        id: gate
        env:
          HAS_CLIENT_ID: ${{ secrets.MINI_APPS_BOT_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.MINI_APPS_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_CLIENT_ID" = "true" ] && [ "$HAS_PRIVATE_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_CLIENT_ID" = "false" ] && [ "$HAS_PRIVATE_KEY" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Bot comment skipped (DRY RUN): the secrets MINI_APPS_BOT_CLIENT_ID and MINI_APPS_BOT_PRIVATE_KEY are not set here (a fork's pull request, or the App does not exist yet). No comment was posted; the verdict is in the review job's summary and its artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Bot comment FAILED CLOSED** (DRY RUN): only one of MINI_APPS_BOT_CLIENT_ID and MINI_APPS_BOT_PRIVATE_KEY is set. Nothing was posted." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # The tool again: the BASE commit's tree. Nothing of the pull request.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tool
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          bun-version: 1.4.2
          no-cache: true
      # This run's review artifact. A pattern, so a missing artifact downloads
      # nothing instead of failing here: the comment step then sets the comment
      # to FAIL bot_error for this head and fails the job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          pattern: mini-apps-review
          merge-multiple: true
          path: ${{ runner.temp }}/review
      # Minted last, scoped to this repository and to Pull requests write
      # (issue comments on a pull request), revoked in the action's post step.
      - name: Mint the bot token
        id: token
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MINI_APPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MINI_APPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      # The token goes to the script on stdin, and env -u keeps it out of
      # bun's environment. Every value arrives through env.
      - name: Post the comment (dry run)
        if: steps.gate.outputs.enabled == 'true'
        env:
          BOT_TOKEN: ${{ steps.token.outputs.token }}
          BOT_LOGIN: ${{ steps.token.outputs.app-slug }}[bot]
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s' "$BOT_TOKEN" | env -u BOT_TOKEN bun --config=/dev/null --no-env-file --no-install --tsconfig-override=/dev/null ./tool/scripts/mini-apps-review-comment.ts \
            --repo "$REPO" --pr "$PR_NUMBER" --head "$HEAD_SHA" --report "$RUNNER_TEMP/review/mini-apps-review.json" \
            --bot-login "$BOT_LOGIN" --run-url "$RUN_URL" --summary "$GITHUB_STEP_SUMMARY"
