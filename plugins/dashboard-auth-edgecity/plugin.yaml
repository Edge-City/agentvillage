name: dashboard-auth-edgecity
version: 1.4.0
description: "Dashboard auth — Edge City email OTP on Hermes's login form, plus landing admin SSO, the archive job's read-only archive_read bearer on GET /api/sessions and GET /api/sessions/<id>/messages, and the resident guard (SEC-1): a session that is not an edgecity admin may use only a named allow-list of dashboard routes, sockets and chat-gateway methods (sign-in, the page shell, its own sessions, chat uploads and methods, the approvals card); everything else, plugin management, config, env, files, hooks and the console included, answers 403 or is refused, and private paths are refused on every listed route. A resident keeps the dashboard Chat tab (1.4.0): its terminal chat attaches to the gateway with a credential minted for that one terminal and bound to the resident's login, so it chats with its own agent as itself, under the same method list, and no profile, workspace, channel or resumed chat but its own. A resident acts only on its own chats and sessions and sees only its own rows in every session list, answers approvals with once, session or deny (always is admin only), sends no @folder: and no @file: but to its uploads, pastes and chat directory, and chats in a resident directory; the key store is on the agent read deny-list."
author: Edge City
kind: backend
