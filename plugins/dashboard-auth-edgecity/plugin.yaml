name: dashboard-auth-edgecity
version: 1.3.0
description: "Dashboard auth — Edge City email OTP on Hermes's login form, plus landing admin SSO, the archive job's read-only archive_read bearer on GET /api/sessions and GET /api/sessions/<id>/messages, and the resident guard (SEC-1): a session that is not an edgecity admin may use only a named allow-list of dashboard routes, sockets and chat-gateway methods (sign-in, the page shell, its own sessions, chat uploads and methods, the approvals card); everything else, plugin management, config, env, files, hooks, the console and the terminal included, answers 403 or is refused, and private paths are refused on every listed route."
author: Edge City
kind: backend
