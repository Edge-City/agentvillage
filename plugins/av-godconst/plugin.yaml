name: av-godconst
version: 0.2.0
description: "GC-TELEGRAM-BALLOT (docs/GODCONST-TELEGRAM-BALLOT.md): the resident's God Constitution ballot as Telegram button cards from their own bot. While AV_GODCONST_BALLOT is on (written by the control plane from GODCONST_BALLOT_TENANTS), a pass every 60 s reads the resident's own ballot through the control plane (POST /tenants/<own tenant>/godconst/ballot with the box's AV_GODCONST_BALLOT_KEY, a per-tenant key av-approval custody strips from every agent-run child; CONTROL_PLANE_URL pinned to CP_HOSTS; the control plane forwards to the app with the GODCONST bridge key) and, once the pool is rating, sends a header (village daytime only) and the statements in the resident's own order two at a time (a pair: one agent-written and one ODIN-written statement under the app's godconst-order-v2), five buttons 1..5 each (contracts.ts labels). One Telegram CallbackQueryHandler scoped to callback_data starting gcb: (ctx.register_platform_handler, block=False) accepts taps from the box's own resident in their own DM only (av-vote's rule) and saves each as one rating on the SAME ballot the /constitution page shows (POST .../godconst/ballot/rate; the app merges it per statement, last write wins); a re-tap is a revision; the next pair follows once the current one is rated; a final line when every statement is rated; Stop / Resume on the header; Submit my ratings (header, last card of each page, final line; confirmed first) submits the app's merged draft; an ending (submitted, closed, the window over, withdrawn) deletes the session and keeps a tombstone; an empty marker $HERMES_HOME/av-events/godconst/page-open exists while a sent page has unrated cards (touched on each page, removed on completion, Stop, every ending and at start when stale) so av-elicit holds its opener. A change on the web page re-marks the card on the next read. Never writes a statement text or a rating value to disk (the ledger av-godconst/ballot.json holds ids, positions and message ids; no value, mark or key), never injects anything into the agent's session, never emits an event, never logs anything but codes and counts. Second, independent mode (GC-ELICIT §11.4, non-voter elicitation cards): while AV_GODCONST_ELICIT_CARDS is exactly 1 (the ballot switch not needed), the same pass shows the statements listed in $HERMES_HOME/av-events/godconst/elicit-cards.json (written by the control plane after a non-voter elicitation window settles; removed on withdrawal) once the file is valid (a regular, own, not group/world-writable file, opened O_NOFOLLOW|O_NONBLOCK) and unexpired, no av-elicit opener is pending (av-events/elicit/inject/*.txt or *.sending) and the ballot mode is not busy (no ballot page open, no active ballot session): cards read from POST .../godconst/elicitation-cards (the participant's order, saved ratings prefilled), a short header (village daytime) with Stop, then two at a time, each labelled Follow-up (not your ballot), with buttons 1..5; a second CallbackQueryHandler scoped to gce: (same owner rule) saves one rating per tap via POST .../godconst/elicitation-ratings (channel telegram_card), never on the ballot, outside the plugin's lock (only the ledger merge and the advance take it); the next pair after the current one is rated, a thank-you when all are rated (re-taps still save until expiry or withdrawal); a 422 unknown_statement drops that one card. Withdrawal (the file missing on two passes), expiry, a final 4xx refusal, Stop, a changed order or three failed sends delete the session and keep a tombstone per elicitation id (never restarted; later taps answer closed). Its ledger av-godconst/elicit.json holds ids, positions and message ids only; the page-open marker stays while either mode has an open page. Fail-open: no tools, no hooks, never raises into the gateway."
author: Edge City
kind: backend
optional_env:
  - AV_GODCONST_BALLOT
  - AV_GODCONST_ELICIT_CARDS
  - CONTROL_PLANE_URL
  - AV_GODCONST_BALLOT_KEY
  - TELEGRAM_HOME_CHANNEL
  - AV_TENANT_ID
  - TENANT_ID
