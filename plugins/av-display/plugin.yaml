name: av-display
version: 0.4.0
description: "Telegram tool-progress lines name the tool, never the command (RC28). At register() it extends two display tables in Hermes's agent.display: _TOOL_VERBS gains a verb for the Village's own tools (Index, recall, av-events), and _TOOL_VERBS_NO_PREVIEW gains the built-ins whose argument preview is a command, a file or a memory (terminal, execute_code, read_file, write_file, patch, search_files, memory, todo_list, delegate_task, cronjob_manage) and those Village tools. It also wraps one display method, gateway.run_turn_runner TurnRunner._progress_terminal_blocks, so a terminal call on Telegram gets no code block holding its command (Telegram's adapter sets supports_code_blocks, and that block is built before the verb tables are read); every other platform keeps Hermes's block (0.2.1: the wrapper passes every argument after the adapter through). web_search and web_extract keep their query or URL. 0.3.0 (rc42) also wraps gateway.run_turn GatewayTurnMixin._hmwa_hygiene_notify (only when it is a coroutine function) so two of Hermes's session-hygiene compaction notices, the turn-hold \"Context compression deferred — summary still streaming\" and the auxiliary-model fallback, are logged, not posted to the chat. The compaction timeout and the aborted-summary notices stay visible (they name /compress and /new), and any other label, near-miss or argument shape goes through to Hermes's own method (fail-open). display.suppress_warning_notifications is never set: it also hides failures a resident must act on. 0.4.0 (rc44) registers a /village command whose handler returns a fixed text of what Agent Village can do (no LLM call, no network), and wraps gateway.run_turn GatewayTurnMixin._hmwa_first_contact_notes (only when it is a coroutine function) so the note Hermes adds to the very first message on a box says /village shows what Agent Village can do instead of /help shows commands (exact phrases only, fail-open). Nothing else is patched; tool execution and compaction are untouched. A Hermes without the tables or the methods is left alone. No tools, no hooks; its only message is the /village reply."
author: Edge City
kind: backend
