name: av-approval
version: 0.1.0
description: "Agent Village approval.md receipts (DATA-43, opt-in). At this approval.md core version the facade has no surface that can record a Hermes receipt, so the plugin registers no hook and logs that receipts are disabled; the gate itself is the shell-hook shim the approval skill installs, and the DATA-43b follower derives receipts from the daemon log. AV_APPROVAL_ENABLED off logs a fail-open line."
author: Edge City
kind: backend
optional_env:
  - AV_APPROVAL_ENABLED
  - AV_APPROVAL_URL
  - AV_APPROVAL_TOKEN
# Documentation only — Hermes reads hooks from ctx.register_hook(). This plugin
# registers none at this version (README.md, "Why a stub").
provides_hooks: []
