name: av-approval
version: 0.2.0
description: "Agent Village approval.md (DATA-43, opt-in): the approval gate's fail-closed backstop and the receipts stub. With AV_APPROVAL_ENABLED on, register() checks the installed gate before Hermes registers its shell hooks (hooks block, consent in config.yaml and .env, the consent allowlist and its lock, the shim's sha256, AV_APPROVAL_URL) and a pre_tool_call callback raises for every gated tool while that check fails (DATA-234). Receipts stay disabled: the facade has no surface that can record a Hermes receipt at this approval.md core version. AV_APPROVAL_ENABLED off logs a fail-open line."
author: Edge City
kind: backend
optional_env:
  - AV_APPROVAL_ENABLED
  - AV_APPROVAL_URL
  - AV_APPROVAL_TOKEN
# Documentation only — Hermes reads hooks from ctx.register_hook(). The
# backstop registers pre_tool_call when the switch is on (README.md).
provides_hooks:
  - pre_tool_call
